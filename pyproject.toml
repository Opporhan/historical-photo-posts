[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "historical-photo-posts"
version = "0.1.0"
description = "Find public-domain historical photographs, restore them gently, and turn them into Instagram/TikTok-ready posts with license evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pillow>=10.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
captions = ["anthropic>=1.0"]
dev = ["pytest>=8.0", "responses>=0.25", "ruff>=0.5", "anthropic>=1.0"]

[project.scripts]
histposts = "histposts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
histposts = ["assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
