  info: Alfred Stieglitz, 1903'te New York'un Flatiron Binası'nı fotoğrafladı. Bina, bu fotoğraftan bir yıl önce,
    1902'de tamamlanmıştı ve kısa sürede kentin simgelerinden biri oldu.
  story: |-
    Alfred Stieglitz, 1903'te New York'un Flatiron Binası'nı fotoğrafladı. Bina 1902'de tamamlanmıştı ve kısa sürede kentin simgelerinden biri oldu.

    Stieglitz (1864–1946), fotoğrafın bir sanat olarak kabul edilmesi için çalışan öncü isimlerden biriydi. Bu görüntü Google Art Project üzerinden bir müze koleksiyonundan geliyor.
  tags:
  - '#newyork'
  - '#stieglitz'
  - '#1903'
  title_en: The Flatiron Building, New York
  story_en: |-
    In 1903 Alfred Stieglitz photographed New York's Flatiron Building. The building had been completed in 1902 and quickly became one of the city's landmarks.

    Stieglitz (1864–1946) was among the pioneers who argued that photography could be an art. This image comes from a museum collection via the Google Art Project.
