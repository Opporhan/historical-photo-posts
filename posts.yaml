  year: '1862'
  title: Antietam Köprüsü
  place: Maryland
  author_qid: Q661176
  info: Alexander Gardner'a atfedilen bu albümin baskı, Kongre Kütüphanesi'nde 'Antietam bridge, Maryland' başlığıyla
    saklanıyor. Kare, Amerikan İç Savaşı'nın Antietam muharebesi dönemine ait.
  story: |-
    Kongre Kütüphanesi bu görüntüyü 'Antietam köprüsü, Maryland' başlığıyla, Alexander Gardner'a atfedilen tek bir albümin baskı olarak kaydediyor. Antietam Muharebesi, 17 Eylül 1862'de Maryland'de yapıldı.

    Gardner'ın bölgede çektiği fotoğraflar, savaşın sonuçlarını kamuoyuna gösteren ilk görüntüler arasında sayılır.
  tags:
  - '#içsavaş'
  - '#antietam'
  - '#1862'
  title_en: The Antietam Bridge
  story_en: |-
    The Library of Congress records this image as 'Antietam bridge, Maryland', a single albumen print by Alexander Gardner. The Battle of Antietam was fought in Maryland on 17 September 1862.

    Gardner's photographs of the area are counted among the first images to show the public the aftermath of the war.
- name: canyon-de-chelly-1873
  file: Canyon de Chelly ppmsca.10057.jpg
  year: '1873'
  title: Canyon de Chelly, Arizona
  place: Arizona
  author_qid: Q1371063
  info: Timothy H. O'Sullivan'ın 1873'te Arizona'da çektiği bu fotoğraf, ABD'nin 100. meridyeninin batısındaki coğrafi
    ve jeolojik keşif seferlerinin bir parçası olarak elde edildi.
  story: |-
    Kongre Kütüphanesi kaydına göre bu fotoğraf, 1871, 1872 ve 1873 mevsimlerinde 100. meridyenin batısında yapılan coğrafi ve jeolojik keşif ve harita çalışmaları sırasında elde edildi. Fotoğrafçı Timothy H. O'Sullivan (1840–1882), bu seferlerde çalışan fotoğrafçılardan biriydi.

    Canyon de Chelly bugün Arizona'da bir ABD ulusal anıtıdır.
  tags:
  - '#arizona'
  - '#osullivan'
  - '#1873'
  title_en: Canyon de Chelly, Arizona
  story_en: |-
    According to the Library of Congress record, this photograph was made during the geographical and geological explorations and surveys west of the 100th meridian in the seasons of 1871, 1872 and 1873. The photographer, Timothy H. O'Sullivan (1840–1882), was one of those who worked on these expeditions.

    Canyon de Chelly is today a U.S. national monument in Arizona.
